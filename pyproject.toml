[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_observability"
version = "0.1.0"
dependencies = [
    "python-dotenv",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "azure-monitor-opentelemetry",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-dir]
agent_observability = "."
